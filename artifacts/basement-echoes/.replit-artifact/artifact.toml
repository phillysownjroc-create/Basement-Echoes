kind = "web"
previewPath = "/"
title = "Basement Echoes"
version = "1.0.0"
id = "artifacts/basement-echoes"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26246

[services.development]
run = "pnpm --filter @workspace/basement-echoes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/basement-echoes", "run", "build" ]
publicDir = "artifacts/basement-echoes/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26246"
BASE_PATH = "/"
